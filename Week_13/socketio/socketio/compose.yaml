services:
  blog-database:
    image: mongo
    ports:
      - '27017:27017'
  blog-backend:
    build: backend/
    environment:
      - PORT=3001
      - DATABASE_URL=mongodb://host.docker.internal:27017/blog
      - JWT_SECRET=jfrunfrun4ur484f9n8n94f0n
    ports:
      - '3001:3001'
    depends_on:
      - blog-database
  blog-frontend:
    build:
      context: .
      target: build
      args:
        VITE_BACKEND_URL: http://localhost:3001/api/v1
        VITE_SOCKET_HOST: http://localhost:3001
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - '5173:5173'
    volumes:
      - ./:/build
      - /build/node_modules
    depends_on:
      - blog-backend
